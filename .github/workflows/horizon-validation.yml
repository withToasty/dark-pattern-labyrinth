name: city-techno-vision horizon validation

permissions:
  contents: write

on:
  push:
    branches:
      - feature/horizon-detection
    paths:
      - "city-techno-vision/src/horizon.py"
      - "city-techno-vision/src/visualize.py"
      - "city-techno-vision/detect.py"
      - "city-techno-vision/tests/test_horizon.py"
      - ".github/workflows/horizon-validation.yml"
  pull_request:
    paths:
      - "city-techno-vision/src/horizon.py"
      - "city-techno-vision/src/visualize.py"
      - "city-techno-vision/detect.py"
      - "city-techno-vision/tests/test_horizon.py"
      - ".github/workflows/horizon-validation.yml"
  workflow_dispatch:

jobs:
  validate-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          pip install pytest numpy opencv-python-headless

      - name: Run horizon tests
        working-directory: city-techno-vision
        run: |
          pytest -q tests/test_horizon.py

      - name: Recover and test previous Kobe photo
        working-directory: city-techno-vision
        run: |
          git fetch origin 1c14c9e972de20285f802da48a5e55a676ed57a3 --depth=1
          git show FETCH_HEAD:city-techno-vision/tests/fixtures/kobe_fence_test.jpg > /tmp/kobe_fence_test.jpg
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2
          from src.horizon import estimate_horizon
          from src.visualize import draw_horizon

          original = cv2.imread("/tmp/kobe_fence_test.jpg")
          assert original is not None
          h, w = original.shape[:2]
          scale = min(1.0, 1000.0 / max(w, h))
          working = cv2.resize(
              original,
              (round(w * scale), round(h * scale)),
              interpolation=cv2.INTER_AREA,
          )
          result = estimate_horizon(working)

          if result.detected:
              result.left_y /= scale
              result.right_y /= scale
              result.center_y /= scale
              result.center_y_normalized = result.center_y / h
              for vp in result.vanishing_points or []:
                  vp.x /= scale
                  vp.y /= scale

          data = result.to_dict()
          data["validation"] = {
              "source": "city-techno-vision/tests/fixtures/kobe_fence_test.jpg",
              "source_commit": "1c14c9e972de20285f802da48a5e55a676ed57a3",
              "original_width": w,
              "original_height": h,
              "analysis_scale": scale,
              "analysis_width": working.shape[1],
              "analysis_height": working.shape[0],
          }

          out = Path("validation")
          out.mkdir(exist_ok=True)
          (out / "kobe_horizon_result.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )

          rendered = draw_horizon(original, result)
          cv2.imwrite(str(out / "kobe_horizon_result.jpg"), rendered)

          print("KOBE_RESULT")
          print(json.dumps(data, indent=2))
          PY

      - name: Commit Kobe validation result
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city-techno-vision/validation/kobe_horizon_result.json city-techno-vision/validation/kobe_horizon_result.jpg
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Record Kobe horizon validation result"
            git push
          fi

      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: horizon-validation-output
          path: city-techno-vision/validation/
