name: city-techno-vision confidence validation

permissions:
  contents: write

on:
  push:
    branches:
      - feature/horizon-detection
    paths:
      - ".github/workflows/horizon-validation.yml"
  workflow_dispatch:

jobs:
  compare-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YOLO dependencies
        run: |
          pip install ultralytics opencv-python-headless

      - name: Recover exact Kobe source photo
        run: |
          git fetch origin 1c14c9e972de20285f802da48a5e55a676ed57a3 --depth=1
          git show FETCH_HEAD:city-techno-vision/tests/fixtures/kobe_fence_test.jpg > /tmp/kobe_fence_test.jpg
          file /tmp/kobe_fence_test.jpg

      - name: Compare YOLO confidence thresholds
        working-directory: city-techno-vision
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from ultralytics import YOLO

          image = "/tmp/kobe_fence_test.jpg"
          model = YOLO("yolov8n-oiv7.pt")
          result = model.predict(source=image, conf=0.01, verbose=False)[0]
          names = result.names

          raw = []
          for box in result.boxes:
              cls_id = int(box.cls.item())
              confidence = float(box.conf.item())
              xyxy = [round(float(v), 1) for v in box.xyxy[0].tolist()]
              raw.append({
                  "label": names[cls_id],
                  "confidence": round(confidence, 4),
                  "xyxy": xyxy,
              })
          raw.sort(key=lambda item: item["confidence"], reverse=True)

          thresholds = [0.10, 0.15, 0.20, 0.25]
          comparisons = {}
          for threshold in thresholds:
              kept = [item for item in raw if item["confidence"] >= threshold]
              cars = [item for item in kept if item["label"].casefold() == "car"]
              comparisons[f"{threshold:.2f}"] = {
                  "total": len(kept),
                  "labels": dict(Counter(item["label"] for item in kept)),
                  "cars": cars,
              }

          car_candidates = [
              item for item in raw if item["label"].casefold() == "car"
          ]

          data = {
              "model": "yolov8n-oiv7.pt",
              "source": "city-techno-vision/tests/fixtures/kobe_fence_test.jpg",
              "source_commit": "1c14c9e972de20285f802da48a5e55a676ed57a3",
              "inference_floor": 0.01,
              "car_candidates": car_candidates,
              "thresholds": comparisons,
              "all_predictions": raw,
          }

          out = Path("validation")
          out.mkdir(exist_ok=True)
          (out / "kobe_confidence_comparison.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "car_candidates": car_candidates,
              "thresholds": comparisons,
          }, indent=2))
          PY

      - name: Commit comparison result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city-techno-vision/validation/kobe_confidence_comparison.json
          git commit -m "Record Kobe confidence comparison"
          git push
