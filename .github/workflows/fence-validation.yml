name: city-techno-vision fence validation

# Manual-only: runs the real SegFormer fence-detection path end-to-end on a
# GitHub Actions runner, where huggingface.co is reachable (unlike the Claude
# sandbox, which blocks it -- see city-techno-vision/STATUS.md).
on:
  push:
    branches:
      - test/fence-conf-010-20260921
  workflow_dispatch:
    inputs:
      image_url:
        description: "URL of a street-scene photo containing a fence (optional)"
        required: false
        default: ""
      image_path:
        description: "Path, relative to repo root, to a photo already in the checkout (optional)"
        required: false
        default: ""

jobs:
  validate-fence-detection:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU-only torch)
        working-directory: city-techno-vision
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt

      - name: Download SegFormer fence model
        run: |
          python - <<'EOF'
          from transformers import SegformerImageProcessor, SegformerForSemanticSegmentation
          model_id = "nvidia/segformer-b0-finetuned-cityscapes-1024-1024"
          SegformerImageProcessor.from_pretrained(model_id)
          SegformerForSemanticSegmentation.from_pretrained(model_id)
          print(f"model ready: {model_id}")
          EOF

      - name: Resolve test image
        id: image
        env:
          IMAGE_URL: ${{ github.event.inputs.image_url }}
          IMAGE_PATH: ${{ github.event.inputs.image_path }}
        run: |
          mkdir -p /tmp/fence-input
          if [ -n "$IMAGE_PATH" ]; then
            cp "$IMAGE_PATH" /tmp/fence-input/photo.jpg
          elif [ -n "$IMAGE_URL" ]; then
            curl -sSL "$IMAGE_URL" -o /tmp/fence-input/photo.jpg
          else
            cp "city-techno-vision/tests/fixtures/kobe_fence_test_2.jpg" /tmp/fence-input/photo.jpg
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"

      - name: Run detect.py (general detector + fence)
        if: steps.image.outputs.blocked == 'false'
        working-directory: city-techno-vision
        run: |
          python detect.py \
            --image /tmp/fence-input/photo.jpg \
            --output-dir /tmp/fence-output \
            --conf 0.10 \
            --fence-model nvidia/segformer-b0-finetuned-cityscapes-1024-1024

      - name: Summarize result
        if: always()
        run: |
          echo "model: nvidia/segformer-b0-finetuned-cityscapes-1024-1024"
          if [ "${{ steps.image.outputs.blocked }}" = "true" ]; then
            echo "status: blocked (no test image provided)"
          elif [ -f /tmp/fence-output/detections.json ]; then
            python - <<'EOF'
          import json
          with open("/tmp/fence-output/detections.json") as f:
              result = json.load(f)
          fence = [d for d in result["detections"] if d["label"] == "fence"]
          print("detections:")
          for d in result["detections"]:
              print(f"  {d['label']}: {d['confidence']}")
          print(f"fence detections: {len(fence)}")
          print(f"total detections: {len(result['detections'])}")
          print("status: success")
          print("output dir: /tmp/fence-output")
          EOF
          else
            echo "status: failed (see previous step logs)"
          fi

      - name: Post conf 0.10 result to temporary issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'EOF'
          import json, os
          path = "/tmp/fence-output/detections.json"
          lines = [
              "## conf=0.10 validation",
              f"run_id: {os.environ.get('RUN_ID')}",
          ]
          if os.path.exists(path):
              with open(path) as f:
                  result = json.load(f)
              lines.append(f"total detections: {len(result['detections'])}")
              lines.append("")
              lines.append("| label | confidence | minx | maxx | miny | maxy |")
              lines.append("|---|---:|---:|---:|---:|---:|")
              for d in result["detections"]:
                  lines.append(
                      f"| {d['label']} | {d['confidence']} | {d['minx']} | {d['maxx']} | {d['miny']} | {d['maxy']} |"
                  )
          else:
              lines.append("detections.json not generated")
          with open("/tmp/conf010-summary.md", "w") as f:
              f.write("\n".join(lines))
          EOF
          gh issue comment 15 --repo withToasty/dark-pattern-labyrinth --body-file /tmp/conf010-summary.md

      - name: Upload artifacts
        if: steps.image.outputs.blocked == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: fence-validation-output
          path: /tmp/fence-output/
